name: Mirror APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mirror-apk.yml"

jobs:
  mirror:
    name: Mirror APK to tmpfiles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release APK
        run: |
          curl -L --fail --retry 5 --retry-delay 3 \
            -o app-release.apk \
            https://github.com/manuysys/SAAS_GESTION_APP/releases/download/mobile-apk-3/app-release.apk

      - name: Upload to tmpfiles
        id: upload
        run: |
          response=$(curl -s --fail -F "file=@app-release.apk" https://tmpfiles.org/api/v1/upload)
          url=$(echo "$response" | jq -r '.data.url')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "APK_URL=$url"

      - name: Publish mirror URL in release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit mobile-apk-3 --notes "APK mirror: ${{ steps.upload.outputs.url }}"
