name: Database backup

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  backup:
    name: Dump Neon PostgreSQL
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Dump database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::warning::NEON_DATABASE_URL no configurada; no se respaldo nada. Ver docs/BACKUP_RESTORE.md."
            exit 0
          fi
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file=backup.dump
      - name: Upload backup artifact
        if: ${{ env.DATABASE_URL != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: neon-backup-${{ github.run_id }}
          path: backup.dump
          retention-days: 14
