name: Android APK (debug signing)

# Genera un APK de prueba firmado con la keystore de debug que crea Expo.
# NO es publicable en Google Play: para eso existe .github/workflows/android-release.yml,
# que produce un AAB firmado con la keystore de release y falla si faltan los secretos.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    name: Build test APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild Android
        env:
          EXPO_PUBLIC_API_URL: https://saas-gestion-api.vercel.app
          EXPO_PUBLIC_DEMO_TENANT_SLUG: servicios-demo
        run: pnpm exec expo prebuild -p android --no-install

      - name: Build APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Warn about signing
        run: |
          echo "::warning::APK firmado con la keystore de debug. Sirve para probar en un dispositivo, no para Google Play."

      - uses: actions/upload-artifact@v4
        with:
          name: dovexo-android-apk-debug
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK as release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-apk-${{ github.run_number }}
          name: DOVEXO Android APK (debug) ${{ github.run_number }}
          body: |
            APK de prueba firmado con la keystore de debug.
            No es publicable en Google Play. Ver docs/ANDROID_RELEASE.md.
          prerelease: true
          files: ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}