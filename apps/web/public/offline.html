<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · SaaS Gestión</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: #fafafa;
        color: #18181b;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      }
      main {
        max-width: 360px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e4e4e7;
        border-radius: 16px;
        padding: 24px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        line-height: 1.5;
        color: #52525b;
        margin: 0 0 20px;
      }
      button {
        min-height: 48px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        background: #18181b;
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #18181b;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>
        No hay conexión con el servidor. Tus datos no se pudieron actualizar.
        Volvé a intentar cuando tengas señal.
      </p>
      <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
  </body>
</html>
